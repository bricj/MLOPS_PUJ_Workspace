name: CI - Proyecto Final

on:
  push:
    branches: [develop]
    paths:
      - 'ProyectoFinal/**'
  pull_request:
    branches: [develop]
  
  workflow_dispatch:

jobs:

  test-and-build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'  # evita los loops infinitos

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r ProyectoFinal/api_read_models/app/requirements-workflow.txt
        pip install fastapi[all] pytest

    - name: Login a DockerHub
      if: success()
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Generate timestamp
      id: timestamp
      shell: bash
      run: echo "tag=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT

    - name: Construir y subir imagen a DockerHub
      if: success()
      uses: docker/build-push-action@v5
      with:
        context: ./ProyectoFinal/api_read_models
        file: ./ProyectoFinal/api_read_models/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/api_proyecto_final:${{ steps.timestamp.outputs.tag }}

    - name: Reemplazar la imagen en el manifiesto de Argo CD
      run: |
        sed -i "s|image: 04602/api_proyecto_final:.*|image: 04602/api_proyecto_final:${{ steps.timestamp.outputs.tag }}|" ProyectoFinal/manifest/inference-models.yaml
        
    - name: Verifica estado de Git antes del commit
      run: |
        git status
        git diff
    
    - name: Commit y push del nuevo manifiesto
      if: github.ref == 'refs/heads/develop'
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"
        git add Taller6/manifest/api-deployment.yaml
        git commit -m "Actualiza imagen a ${{ steps.timestamp.outputs.tag }} para despliegue"
        git push 